  var screenResult = document.getElementById('screen-result');
  var progressZone = document.getElementById('progressZone');
  var progressNum = document.getElementById('progressNum');
  var progressFill = document.getElementById('progressFill');
  var qText = document.getElementById('qText');
  var qOptions = document.getElementById('qOptions');
  var backBtn = document.getElementById('backBtn');
  var qWrap = document.getElementById('qWrap');

  function showScreen(el){
    [screenIntro, screenQuestion, screenResult].forEach(function(s){ s.classList.remove('active'); });
    el.classList.add('active');
  }

  function renderQuestion(){
    showScreen(screenQuestion);
    progressZone.style.display = 'block';
    var q = QUESTIONS[current];
    progressNum.textContent = (current + 1) + ' / ' + QUESTIONS.length;
    progressFill.style.width = ((current + 1) / QUESTIONS.length * 100) + '%';
    qText.textContent = q.text;
    qOptions.innerHTML = '';
    q.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-btn';
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){ selectAnswer(opt); });
      qOptions.appendChild(btn);
    });
    backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
    qWrap.classList.remove('fade-in');
    void qWrap.offsetWidth;
    qWrap.classList.add('fade-in');
  }

  function selectAnswer(opt){
    answers[current] = opt;
    if(current < QUESTIONS.length - 1){
      current += 1;
      renderQuestion();
    } else {
      trackEvent('CareerCheckComplete');
      renderResult();
    }
  }

    if(current === 0){
      progressZone.style.display = 'none';
      showScreen(screenIntro);
    } else {
      current -= 1;
      renderQuestion();
    }
  });

  document.getElementById('startBtn').addEventListener('click', function(){
    trackEvent('CareerCheckStart');
    current = 0;
    renderQuestion();
  });

  // ---------------------------------------------------------------
  // Scoring
  // ---------------------------------------------------------------
  function computeResult(){
    var loc = {G:0,S:0,W:0,T:0};
    var val = {Gr:0,Co:0,Ac:0,Cr:0};
    var valByQ = {}; // question index -> {Gr,Co,Ac,Cr} contribution (only for Q8-Q10, idx 7-9)

    answers.forEach(function(opt, idx){
      if(!opt) return;
      if(opt.loc){
        Object.keys(opt.loc).forEach(function(k){ loc[k] += opt.loc[k]; });
      }
      if(opt.val){
        var contrib = {Gr:0,Co:0,Ac:0,Cr:0};
        Object.keys(opt.val).forEach(function(k){ val[k] += opt.val[k]; contrib[k] = opt.val[k]; });
        valByQ[idx] = contrib;
      }
    });

    var locType = pickTop(loc, LOC_ORDER);
    var valType = pickTopVal(val, valByQ);

    return { locType: locType, valType: valType };
  }

  function pickTop(scores, order){
    var max = -Infinity;
    order.forEach(function(k){ if(scores[k] > max) max = scores[k]; });
    var tied = order.filter(function(k){ return scores[k] === max; });
    if(tied.length === 1) return tied[0];
    // fallback: fixed priority order (matches A/B/C/D order in the questionnaire)
    return tied[0];
  }

  function pickTopVal(scores, valByQ){
    var max = -Infinity;
    VAL_ORDER.forEach(function(k){ if(scores[k] > max) max = scores[k]; });
    var tied = VAL_ORDER.filter(function(k){ return scores[k] === max; });
    if(tied.length === 1) return tied[0];

    // tie-break priority: Q10 (idx 9) -> Q9 (idx 8) -> Q8 (idx 7)
    var tieBreakQs = [9, 8, 7];
    for(var i = 0; i < tieBreakQs.length; i++){
      var qIdx = tieBreakQs[i];
      var contrib = valByQ[qIdx];
      if(!contrib) continue;
      var qMax = -Infinity;
      tied.forEach(function(k){ if(contrib[k] > qMax) qMax = contrib[k]; });
      var qTied = tied.filter(function(k){ return contrib[k] === qMax; });
      if(qTied.length === 1) return qTied[0];
      tied = qTied;
    }
    // final fallback: fixed priority order (成長・貢献・達成・共創)
    return tied[0];
  }

  // ---------------------------------------------------------------
  // Result render
  // ---------------------------------------------------------------
  var resultRoot = document.getElementById('resultRoot');

  function renderResult(){
    progressZone.style.display = 'none';
    var r = computeResult();
    var loc = LOC_INFO[r.locType];
    var val = VAL_INFO[r.valType];

    var html = '';
    html += '<div class="result-head">';
    html += '  <p class="result-lead">あなたは</p>';
    html += '  <h2 class="result-type"><span class="type-chip ' + loc.accent + '">' + loc.name + '</span></h2>';
    html += '  <p class="result-val-lead">そして、あなたが大切にしているものは</p>';
    html += '  <p class="result-val ' + val.accent + '">' + val.name + '</p>';
    html += '</div>';

    html += '<div class="r-section"><div class="r-num">01</div><div class="r-title">今のあなた</div><div class="r-body">' +
      loc.body.map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</div></div>';

    html += '<div class="r-section"><div class="r-num">02</div><div class="r-title">あなたが大切にしている価値観</div><div class="r-body"><p>' + val.body + '</p></div></div>';

    html += '<div class="r-section"><div class="r-num">03</div><div class="r-title">今つまずきやすいポイント</div><div class="r-body"><p>' + loc.stumble + '</p></div></div>';

    html += '<div class="r-section"><div class="r-num">04</div><div class="r-title">次の一歩</div><ul class="r-list">' +
      loc.next.map(function(n){ return '<li>' + n + '</li>'; }).join('') + '</ul></div>';

    html += '<div class="r-section"><div class="r-num">05</div><div class="r-title">LEGOHAIRとの接点</div><div class="lego-note">' + loc.legohair + '</div></div>';

    html += '<div class="cta-zone">';
    html += '  <a class="cta-btn cta-line" id="lineCta" href="' + LINE_URL + '" target="_blank" rel="noopener noreferrer" data-meta-cta="career_check_line">この診断結果をLINEに保存する</a>';
    html += '  <p class="cta-reassure">転職を決めていなくても大丈夫です。</p>';
    html += '  <a class="cta-btn cta-secondary" id="lpCta" href="' + RECRUIT_LP_URL + '">LEGOHAIRの働き方を見てみる</a>';
    html += '  <button class="cta-btn cta-tertiary" id="retryBtn" type="button">もう一度診断する</button>';
    html += '</div>';

    resultRoot.innerHTML = html;
    showScreen(screenResult);

    document.getElementById('lineCta').addEventListener('click', function(){
      trackLineClick(r);
    });
    document.getElementById('lpCta').addEventListener('click', function(){
      trackEvent('CareerCheckToRecruitLP', { loc_type: r.locType, val_type: r.valType });
    });
    document.getElementById('retryBtn').addEventListener('click', function(){
      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      renderQuestion();
    });

    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------
  // Tracking (reuses existing Meta Pixel; no new analytics stack)
  // ---------------------------------------------------------------
  function trackEvent(name, payload){
    if(typeof fbq !== 'function') return;
    try { fbq('trackCustom', name, payload || {}); } catch(e){}
  }

  function trackLineClick(r){
    if(typeof fbq !== 'function') return;
    // 主イベント（Meta広告最適化用）：Lead は求人LPと同じく必ず独立して発火
    try {
      fbq('track', 'Lead', {
        content_name: 'LEGOHAIR Career Check LINE',
        content_category: 'Recruitment'
      });
    } catch(e){}
    // 分析用の副イベント：求人LPと同じ RecruitLineClick を再利用
    try {
      fbq('trackCustom', 'RecruitLineClick', {
        destination: 'LINE',
        page: 'career_check',
        cta: 'career_check_line',
        loc_type: r.locType,
        val_type: r.valType
      });
    } catch(e){}
  }

})();
</script>
